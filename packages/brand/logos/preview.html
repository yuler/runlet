<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runlet Clean PNG Logos</title>
    <style>
      :root {
        color: #111827;
        background: #efeee9;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 32px;
        line-height: 1.1;
      }

      h2 {
        margin-top: 34px;
        margin-bottom: 14px;
        font-size: 20px;
      }

      p {
        margin: 8px 0 28px;
        color: #4b5563;
        font-size: 16px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .wide {
        grid-column: span 2;
      }

      figure {
        margin: 0;
        background: #ffffff;
        border: 1px solid rgba(17, 24, 39, 0.12);
        border-radius: 8px;
        overflow: hidden;
      }

      .preview {
        display: grid;
        min-height: 270px;
        place-items: center;
        padding: 18px;
        background-color: #f8fafc;
        background-image:
          linear-gradient(45deg, rgba(17, 24, 39, 0.08) 25%, transparent 25%),
          linear-gradient(-45deg, rgba(17, 24, 39, 0.08) 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, rgba(17, 24, 39, 0.08) 75%),
          linear-gradient(-45deg, transparent 75%, rgba(17, 24, 39, 0.08) 75%);
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-size: 24px 24px;
      }

      .preview.dark {
        background-color: #111827;
      }

      img {
        display: block;
        max-width: 100%;
        max-height: 300px;
        object-fit: contain;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-top: 1px solid rgba(17, 24, 39, 0.08);
        color: #374151;
        font-size: 14px;
      }

      code {
        color: #111827;
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 20px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .wide {
          grid-column: span 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Runlet Clean PNG Logos</h1>
      <p>Transparent PNG assets. Slogan: Let it run.</p>

      <h2>Primary</h2>
      <section class="grid" aria-label="Primary clean PNG logos">
        <figure class="wide">
          <div class="preview"><img src="./runlet-logo-clean-01-primary-lockup.png" alt="Runlet primary lockup" /></div>
          <figcaption><span>Primary Lockup</span><code>2048x820</code></figcaption>
        </figure>
        <figure>
          <div class="preview"><img src="./runlet-logo-clean-02-primary-mark.png" alt="Runlet primary mark" /></div>
          <figcaption><span>Primary Mark</span><code>1024x1024</code></figcaption>
        </figure>
        <figure>
          <div class="preview"><img src="./runlet-logo-clean-03-app-icon-dark.png" alt="Runlet dark app icon" /></div>
          <figcaption><span>Dark App Icon</span><code>1024x1024</code></figcaption>
        </figure>
        <figure class="wide">
          <div class="preview"><img src="./runlet-logo-clean-04-sticker-lockup.png" alt="Runlet sticker lockup" /></div>
          <figcaption><span>Sticker Lockup</span><code>1400x760</code></figcaption>
        </figure>
        <figure>
          <div class="preview"><img src="./runlet-logo-clean-05-circle-badge.png" alt="Runlet circle badge" /></div>
          <figcaption><span>Circle Badge</span><code>1024x1024</code></figcaption>
        </figure>
        <figure>
          <div class="preview"><img src="./runlet-logo-clean-06-small-icon.png" alt="Runlet small icon" /></div>
          <figcaption><span>Small Icon</span><code>1024x1024</code></figcaption>
        </figure>
      </section>

      <h2>App Icon Concepts</h2>
      <section class="grid" aria-label="Clean app icon PNG concepts">
        <figure>
          <div class="preview"><img src="./runlet-logo-clean-07-appicon-r-play-dark.png" alt="R play dark app icon" /></div>
          <figcaption><span>R Play Dark</span><code>1024x1024</code></figcaption>
        </figure>
        <figure>
          <div class="preview"><img src="./runlet-logo-clean-08-appicon-r-play-light.png" alt="R play light app icon" /></div>
          <figcaption><span>R Play Light</span><code>1024x1024</code></figcaption>
        </figure>
        <figure>
          <div class="preview"><img src="./runlet-logo-clean-09-appicon-node-flow.png" alt="Node flow app icon" /></div>
          <figcaption><span>Node Flow</span><code>1024x1024</code></figcaption>
        </figure>
        <figure>
          <div class="preview"><img src="./runlet-logo-clean-10-appicon-arrow-r.png" alt="Arrow R app icon" /></div>
          <figcaption><span>Arrow R</span><code>1024x1024</code></figcaption>
        </figure>
        <figure>
          <div class="preview"><img src="./runlet-logo-clean-11-appicon-terminal.png" alt="Terminal app icon" /></div>
          <figcaption><span>Terminal</span><code>1024x1024</code></figcaption>
        </figure>
        <figure>
          <div class="preview"><img src="./runlet-logo-clean-12-appicon-fast-r.png" alt="Fast R app icon" /></div>
          <figcaption><span>Fast R</span><code>1024x1024</code></figcaption>
        </figure>
      </section>

      <h2>Dark Kit</h2>
      <section class="grid" aria-label="Clean dark kit PNG logos">
        <figure class="wide">
          <div class="preview dark"><img src="./runlet-logo-clean-13-dark-primary-lockup.png" alt="Dark primary Runlet lockup" /></div>
          <figcaption><span>Dark Primary Lockup</span><code>2048x820</code></figcaption>
        </figure>
        <figure>
          <div class="preview dark"><img src="./runlet-logo-clean-14-dark-grid-mark.png" alt="Dark grid Runlet mark" /></div>
          <figcaption><span>Dark Grid Mark</span><code>1024x1024</code></figcaption>
        </figure>
        <figure>
          <div class="preview dark"><img src="./runlet-logo-clean-15-dark-app-icon.png" alt="Dark app icon" /></div>
          <figcaption><span>Dark App Icon</span><code>1024x1024</code></figcaption>
        </figure>
        <figure>
          <div class="preview dark"><img src="./runlet-logo-clean-16-readme-badge.png" alt="Runlet README badge" /></div>
          <figcaption><span>README Badge</span><code>1400x420</code></figcaption>
        </figure>
        <figure>
          <div class="preview dark"><img src="./runlet-logo-clean-17-dark-sticker.png" alt="Runlet dark sticker" /></div>
          <figcaption><span>Dark Sticker</span><code>1200x900</code></figcaption>
        </figure>
        <figure>
          <div class="preview dark"><img src="./runlet-logo-clean-18-cli-lockup.png" alt="Runlet CLI lockup" /></div>
          <figcaption><span>CLI Lockup</span><code>1400x520</code></figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
